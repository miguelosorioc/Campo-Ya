<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - CampoYa</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/estilologin.css">
</head>
<body class="admin-login">
    <main class="page">
        <header class="topbar">
            <a href="index.html" class="brand">
                <span class="brand-circle"></span>
                CampoYa Admin
            </a>
        </header>

        <section class="hero">
            <div class="login-panel" id="loginPanel">
                <h1>Iniciar sesión</h1>
                <p>Introduce tus credenciales para acceder al panel de administración.</p>
                <form id="adminLoginForm">
                    <label>
                        Usuario
                        <input type="text" name="username" placeholder="admin" required>
                    </label>
                    <label>
                        Contraseña
                        <input type="password" name="password" placeholder="1234" required>
                    </label>
                    <p class="error-msg" id="loginError" aria-live="polite"></p>
                    <button type="submit" class="primary">Iniciar Sesión</button>
                </form>
                <div class="form-footer">
                    <p>¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
                </div>
            </div>

           
        </section>
    </main>

    <script src="admin/admin.js" defer></script>
</body>
</html>
