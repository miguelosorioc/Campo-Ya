<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - CampoYa</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="stylesheet" href="CSS/sesion.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <a href="index.html" class="auth-brand">
            <span class="auth-brand-dot"></span>
            CampoYa
        </a>

        <h1>Iniciar sesión</h1>
        <p class="auth-sub">Bienvenido de nuevo. Introduce tus credenciales para continuar.</p>

        <form id="adminLoginForm">
            <div class="field-group">
                <label>Usuario</label>
                <input type="text" name="username" placeholder="usuario123" required>
            </div>
            <div class="field-group">
                <label>Contraseña</label>
                <input type="password" name="password" placeholder="Tu contraseña" required>
            </div>
            <p class="error-msg" id="loginError" aria-live="polite"></p>
            <button type="submit" class="btn-auth">Iniciar sesión</button>
        </form>

        <p class="auth-footer">¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
    </div>

    <script src="admin/admin.js" defer></script>
</body>
</html>
