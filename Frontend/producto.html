<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda - CampoYa</title>
    <link rel="stylesheet" href="CSS/producto-styles.css" />
</head>
<body>
<main class="page">
    <header class="header">
        <div class="brand">
            <div class="logo"></div>
            <h1>CampoYa</h1>
        </div>
        <button class="cart-btn" onclick="window.location.href='carrito.html'">
            🛒 Carrito (<span id="cart-count">0</span>)
        </button>
    </header>

    <nav class="nav">
        <a href="index.html">Inicio</a>
        <a href="perfil.html">Mi perfil</a>
    </nav>

    <section class="hero">
        <div>
            <h2>Productos frescos</h2>
            <p style="color:#5f6b55; font-size:0.88rem; margin-top:4px;">
                Disponibles por 24 horas o hasta agotar existencias.
            </p>
        </div>
        <div class="filters">
            <button class="active" data-categoria="todos">Todos</button>
            <button data-categoria="verdura">Verduras</button>
            <button data-categoria="tuberculo">Hortalizas</button>
            <button data-categoria="fruta">Frutas</button>
            <button data-categoria="otro">Aromáticas</button>
        </div>
    </section>

    <section class="products" id="products-container">
        <div style="grid-column:1/-1; text-align:center; padding:60px 0; color:#5f6b55;">
            Cargando productos...
        </div>
    </section>
</main>

<script src="js/productos.js"></script>
</body>
</html>
